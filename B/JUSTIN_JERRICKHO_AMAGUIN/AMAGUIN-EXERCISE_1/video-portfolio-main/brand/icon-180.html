<!doctype html>
<!--
  EDIT BAY — apple-touch-icon source. Renders public/favicon.svg (the
  canonical mark) at 180×180. Regenerate public/apple-touch-icon.png when
  the mark changes:

  & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu `
      --allow-file-access-from-files --hide-scrollbars --virtual-time-budget=2000 `
      --window-size=180,180 --screenshot="<repo>\video-portfolio\public\apple-touch-icon.png" `
      "<repo>\video-portfolio\brand\icon-180.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
      }
      img {
        display: block;
        width: 180px;
        height: 180px;
      }
    </style>
  </head>
  <body>
    <img src="../public/favicon.svg" alt="" />
  </body>
</html>
