<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- brand mark: orange playhead in a ruler, on charcoal (public/favicon.svg
         is the source of truth; the touch icon is its 180px render — see brand/) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta
      name="description"
      content="Portfolio of Justin Jerrickho Amaguin, video editor — short film, ads, reels, AMV, and motion work."
    />
    <!-- share cards (Phase 6). og.png is the branded 1200×630 card rendered
         from brand/og-card.html; URLs are absolute (scrapers require it). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jerrickho-editing-portfolio.netlify.app/" />
    <meta property="og:title" content="Jerrickho — editor" />
    <meta
      property="og:description"
      content="Portfolio of Justin Jerrickho Amaguin, video editor — short film, ads, reels, AMV, and motion work."
    />
    <meta property="og:image" content="https://jerrickho-editing-portfolio.netlify.app/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jerrickho-editing-portfolio.netlify.app/assets/og.png" />
    <title>Jerrickho — editor</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms build-time detection: static mirror of the React form -->
    <form name="contact" data-netlify="true" netlify-honeypot="b_field" hidden>
      <input name="preset" />
      <input name="preset_other" />
      <input name="name" />
      <input name="email" />
      <textarea name="notes"></textarea>
      <input name="b_field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
