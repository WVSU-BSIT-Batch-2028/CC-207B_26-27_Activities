# Continuous deployment: every push to main that passes the tests is built
# and published to GitHub Pages, with no manual step.
#
# Setup (once): Settings > Pages > Source: GitHub Actions.
# Settings > Secrets and variables > Actions:
#   Variables: CMS, CMS_URL, CMS_SPACE, CMS_PROJECT, CMS_DATASET
#   Secrets:   CMS_TOKEN (only if your CMS needs one; read-only!)
name: Deploy to GitHub Pages

on:
  # TODO C1: run on every push to the main branch, and also by hand
  # (workflow_dispatch:).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # A failing test stops the job here: nothing is deployed.
      - run: flutter test
      - name: Build the web app
        # TODO C2: GitHub Pages serves the site from /<repository name>/,
        # so add --base-href "/${{ github.event.repository.name }}/".
        # Then pass each CMS value with --dart-define, for example
        #   --dart-define=CMS=${{ vars.CMS }}
        #   --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}
        run: flutter build web --release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
