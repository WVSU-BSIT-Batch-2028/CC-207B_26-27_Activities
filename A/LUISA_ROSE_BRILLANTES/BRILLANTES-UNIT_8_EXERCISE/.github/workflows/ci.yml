name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (smoke check)
        run: >-
          flutter build web --release
          --dart-define=CMS=strapi
          --dart-define=CMS_URL=https://example.strapiapp.com
          --dart-define=CMS_TOKEN=placeholder
